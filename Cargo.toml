[package]
name = "agent-gc"
version = "0.2.2"
edition = "2021"
default-run = "agent-gc"

[dependencies]
anyhow = "1"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4", features = ["derive"] }
crossterm = "0.28"
ratatui = "0.29"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
walkdir = "2"

[[bin]]
name = "ag"
path = "src/bin/ag.rs"
